<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>traffic-animation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <div>
        <div class="top-container">
            <img class="sky-img" src="images/sky.jpg" alt="sky-img">
            <img src="images/aeroplane.png" alt="aeroplane" class="aeroplane" width="250px">
            <img src="images/helicopter.png" alt="helicopter" class="helicopter" width="200px" height="200px">
            <img src="images/birds-1.png" alt="bird" class="bird-1" width="700px" height="90px">
            <img src="images/bird-2.png" alt="bird" class="bird-2" width="250px" height="90px">
        </div>
        <div class="element">
            <div class="grass"></div>
            <img class="houses" src="images/houses.png" alt="buildings">
            <div class="walk-way">
                <img class="ped-boy" src="images/pedestrian-boy.png" alt="pedestrian-boy" width="100px" height="100px">
                <img class="ped-woman" src="images/pedestrian-woman.png" alt="pedestrian-woman" width="170px" height="120px">
            </div>
        </div>
        <div class="road">
            <div class="right-lane">
                <img class="road-1" src="images/road.jpg" alt="road">
                <img class="taxi-1 taxi-1a" src="images/taxi-1.png" alt="taxi">
                <img class="trailer trailer-a" src="images/trailer.png" alt="trailer">
                <img class="bike bike-a" src="images/bike.png" alt="bike" width="100px">
                <img class="taxi-1 taxi-1b" src="images/taxi-1.png" alt="taxi">
                <img class="trailer trailer-b" src="images/trailer.png" alt="trailer">
                <img class="bike bike-b" src="images/bike.png" alt="bike" width="100px">
                <img class="taxi-1 taxi-1c" src="images/taxi-1.png" alt="taxi">
            </div>
            <div class="signs">
                <img class="light-1" src="images/lights.png" alt="lights" width="90px">
                <img class="light-2" src="images/lights.png" alt="lights" width="90px">
                <img class="light-3" src="images/lights.png" alt="lights" width="90px">
                <img class="way-1" src="images/sign-post.png" alt="sign-post" width="60px">
                <img class="way-2" src="images/sign-post.png" alt="sign-post" width="60px">
            </div>
            <div class="left-lane">
                <img class="road-2" src="images/road.jpg" alt="road">
                <img class="truck bike truck-a" src="images/truck.png" alt="truck">
                <img class="truck bike truck-b" src="images/truck.png" alt="truck">
                <img class="car" src="images/sport-car.png" alt="car" width="150px">
                <img class="taxi-2 taxi-2a" src="images/taxi-2.png" alt="taxi" width="150px">
                <img class="taxi-2 taxi-2b" src="images/taxi-2.png" alt="taxi" width="150px">
                <img class="bicycle" src="images/bicycle.png" alt="bicycle" width="80px">
                <img class="taxi-2 taxi-2c" src="images/taxi-2.png" alt="taxi" width="150px">
            </div>
        </div>
    </div>
</body>
</html>
